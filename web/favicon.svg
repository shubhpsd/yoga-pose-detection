<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle for better visibility -->
  <circle cx="16" cy="16" r="15" fill="#2D4A2B" stroke="#4A7C59" stroke-width="2"/>
  
  <!-- Tree trunk (bottom of Y) - representing yoga balance -->
  <rect x="14" y="18" width="4" height="8" fill="#8B4513" rx="2"/>
  
  <!-- Left branch of Y - representing reaching/stretching -->
  <path d="M 16 18 L 8 8 L 10 6 L 16 14 Z" fill="#4A7C59"/>
  
  <!-- Right branch of Y - representing balance -->
  <path d="M 16 18 L 24 8 L 22 6 L 16 14 Z" fill="#4A7C59"/>
  
  <!-- Yoga pose figure at the center -->
  <circle cx="16" cy="15" r="2" fill="#F4A460" opacity="0.8"/>
  
  <!-- Leaves/energy points -->
  <circle cx="8" cy="7" r="1.5" fill="#90EE90"/>
  <circle cx="24" cy="7" r="1.5" fill="#90EE90"/>
  <circle cx="16" cy="5" r="1.5" fill="#90EE90"/>
  
  <!-- Small meditation dots -->
  <circle cx="16" cy="8" r="0.5" fill="#FFD700"/>
  <circle cx="14" cy="9" r="0.5" fill="#FFD700"/>
  <circle cx="18" cy="9" r="0.5" fill="#FFD700"/>
  
  <!-- Root/grounding -->
  <ellipse cx="16" cy="27" rx="6" ry="1.5" fill="#654321" opacity="0.7"/>
</svg>